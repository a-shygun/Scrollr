services:
  - type: web
    name: scrollr
    runtime: docker
    plan: free
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com,scrollr.amirshygun.ir,localhost,127.0.0.1
      - key: DATA_ROOT
        value: /app/data
