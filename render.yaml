services:
  - type: web
    name: scrollr
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py initialize_database && python manage.py sync_library && python manage.py collectstatic --noinput
    startCommand: python -m gunicorn scrollr.wsgi:application --bind 0.0.0.0:$PORT --workers 1
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
