{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101114" /><title>
      {% block title %}
        Scrollr
      {% endblock %}
    </title>
    <link rel="stylesheet" href="{% static 'scrollr.css' %}?v=51" />
    <script src="{% static 'scrollr.js' %}?v=54" defer></script>
  </head>
  <body>
    {% if messages %}
      <div class="flash-messages" aria-live="polite">
        {% for message in messages %}
          <div class="scrollr-toast {{ message.tags }}" role="{% if message.tags == 'error' %}alert{% else %}status{% endif %}">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}
    {% block content %}

    {% endblock %}
  </body>
</html>
