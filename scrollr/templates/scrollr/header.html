<header class="topbar">
  <a class="brand" href="{% url 'index' %}" aria-label="Scrollr home">
    <span class="brand-mark">▶</span>
    <span>Scrollr</span>
  </a>

  <nav class="nav-tools" aria-label="Media browsing controls">
    <form class="feed-controls" method="get" action="{% url 'index' %}">
      <input type="hidden" name="q" value="{{ query }}" />
      <div class="view-switch" role="group" aria-label="Feed view">
        <button type="button" data-layout="column" aria-label="Column view" title="Column view" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" /></svg></button>
        <button type="button" data-layout="mosaic" aria-label="Mosaic view" title="Mosaic view" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="8" height="8" /><rect x="13" y="3" width="8" height="5" /><rect x="13" y="10" width="8" height="11" /><rect x="3" y="13" width="8" height="8" /></svg></button>
      </div>

      <label class="category-wrap category-filter" title="Filter by category">
        <span class="filter-label">Category</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6.5h7l2 2h9v10H3z" /></svg>
        <select name="category" aria-label="Filter by category">
          {% for option in category_options %}
            <option value="{{ option.value }}"{% if option.value == selected_category_slug %} selected{% endif %}>{{ option.name }}</option>
          {% endfor %}
        </select>
      </label>

      <label class="category-wrap vote-filter" title="Filter by votes">
        <span class="filter-label">Votes</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10v10H4a2 2 0 0 1-2-2v-6a2 2 0 0 1 2-2h3Zm0 0 4-7a3 3 0 0 1 2 3v4h5a2 2 0 0 1 2 2l-1.3 6a2 2 0 0 1-2 2H7" /></svg>
        <select name="vote" aria-label="Filter by your votes">
          {% for option in vote_options %}
            <option value="{{ option.value }}"{% if option.value == selected_vote %} selected{% endif %}>{{ option.name }}</option>
          {% endfor %}
        </select>
      </label>
      <button class="apply-filters" type="submit">Apply</button>
    </form>

    <div class="header-actions">
      {% if local_library_enabled %}
        <button id="library-toggle" class="library-launch" type="button" aria-label="Choose local media folder" aria-haspopup="dialog" aria-controls="library-dialog" title="Choose local media folder">+</button>
      {% endif %}
      <button id="search-toggle" class="search-launch" type="button" aria-label="Open search" aria-haspopup="dialog" aria-controls="search-dialog" title="Search">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="10.8" cy="10.8" r="6.3" />
          <path d="m16 16 4.3 4.3" />
        </svg>
      </button>
    </div>
  </nav>
  <dialog id="search-dialog" class="search-dialog">
    <form id="search-query-form" method="get" action="{% url 'index' %}">
      <input type="hidden" name="category" value="{{ selected_category_slug }}" />
      <input type="hidden" name="vote" value="{{ selected_vote }}" />
      <div class="search-dialog-heading">
        <label for="search">Search your library</label>
        <button id="close-search" type="submit" formmethod="dialog" aria-label="Close search">×</button>
      </div>
      <div class="search-dialog-field">
        <input id="search" name="q" type="search" value="{{ query }}" placeholder="Search media or categories" autocomplete="off" />
        <button class="search-button" type="submit">Search</button>
      </div>
    </form>
  </dialog>
  {% if local_library_enabled %}
    <dialog id="library-dialog" class="search-dialog library-dialog">
      <form method="post" action="{% url 'set_library_path' %}">
        {% csrf_token %}
        <input type="hidden" name="return_to" value="{{ return_url }}" />
        <div class="search-dialog-heading">
          <label for="library-path">Local media folder</label>
          <button type="submit" formmethod="dialog" aria-label="Close folder settings">×</button>
        </div>
        <p>Enter a folder path on this computer. Leave it blank to return to the bundled demo library.</p>
        <div class="search-dialog-field">
          <input id="library-path" name="path" type="text" value="{{ custom_library_path }}" placeholder="/path/to/media" autocomplete="off" />
          <button class="search-button" type="submit">Use folder</button>
        </div>
        <div class="library-dialog-actions">
          <button type="submit" name="path" value="">Use demo library</button>
        </div>
      </form>
    </dialog>
  {% endif %}
</header>
