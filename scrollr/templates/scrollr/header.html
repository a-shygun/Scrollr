<header class="topbar">
  <a class="brand" href="{% url 'index' %}">
    <span class="brand-mark">▶</span>
    <span>Scrollr</span>
  </a>

  <nav class="nav-tools">
    <form class="feed-controls" method="get" action="{% url 'index' %}">
      <input type="hidden" name="q" value="{{ query }}" />
      <div class="view-switch">
        <button type="button" data-layout="column" title="Column view"><span class="icon icon-column"></span></button>
        <button type="button" data-layout="mosaic" title="Mosaic view"><span class="icon icon-mosaic"></span></button>
      </div>

      <label class="category-wrap" title="Filter by category">
        <span class="icon icon-folder"></span>
        <select name="category">
          {% for option in category_options %}
            <option value="{{ option.value }}"{% if option.value == selected_category %} selected{% endif %}>{{ option.name }}</option>
          {% endfor %}
        </select>
      </label>

    </form>
    <div class="header-actions">
      <button id="search-toggle" class="search-launch" type="button" title="Search">
        <span class="icon icon-search"></span>
      </button>
    </div>
  </nav>
  <dialog id="search-dialog" class="search-dialog">
    <form method="get" action="{% url 'index' %}">
      <input type="hidden" name="category" value="{{ selected_category }}" />
      <div class="search-dialog-heading">
        <label for="search">Search your library</label>
        <button type="submit" formmethod="dialog">×</button>
      </div>
      <div class="search-dialog-field">
        <input id="search" name="q" type="search" value="{{ query }}" placeholder="Search media or categories" autocomplete="off" />
        <button class="search-button" type="submit">Search</button>
      </div>
    </form>
  </dialog>
</header>
