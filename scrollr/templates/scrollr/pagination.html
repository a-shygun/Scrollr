<nav class="pagination" aria-label="Media pages">
  {% if page_obj.has_previous %}
    <a href="?category={{ selected_category_slug }}&amp;vote={{ selected_vote }}&amp;q={{ query|urlencode }}&amp;page={{ page_obj.previous_page_number }}">Previous</a>
  {% endif %}
  {% for page_number in page_range %}
    {% if page_number == page_obj.paginator.ELLIPSIS %}
      <span>…</span>
    {% elif page_number == page_obj.number %}
      <strong>{{ page_number }}</strong>
    {% else %}
      <a href="?category={{ selected_category_slug }}&amp;vote={{ selected_vote }}&amp;q={{ query|urlencode }}&amp;page={{ page_number }}">{{ page_number }}</a>
    {% endif %}
  {% endfor %}
  {% if page_obj.has_next %}
    <a href="?category={{ selected_category_slug }}&amp;vote={{ selected_vote }}&amp;q={{ query|urlencode }}&amp;page={{ page_obj.next_page_number }}">Next</a>
  {% endif %}
</nav>
