<article id="post-{{ item.id }}" class="clip-card">
  <div class="video-frame">
    {% if item.is_vid %}
      <video src="{{ item.url }}" playsinline webkit-playsinline autoplay loop preload="metadata" muted aria-label="{{ item.title }}"></video>
    {% else %}
      <img src="{{ item.url }}" loading="lazy" decoding="async" alt="{{ item.title }}" />
    {% endif %}
    <div class="card-caption">
      <strong>{{ item.title }}</strong>
      <span>{{ item.category }}</span>
    </div>
    <div class="card-votes" role="group" aria-label="Vote on {{ item.title }}">
      {% include 'scrollr/vote_button.html' with choice="like" item=item %}
      {% include 'scrollr/vote_button.html' with choice="dislike" item=item %}
    </div>
  </div>
</article>
