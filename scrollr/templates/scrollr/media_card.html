<article id="post-{{ item.id }}" class="clip-card">
  <div class="video-frame">
    {% if item.is_vid %}
      <video src="{{ item.url }}" playsinline webkit-playsinline autoplay loop preload="auto" muted></video>
    {% else %}
      <img src="{{ item.url }}" loading="eager" decoding="async" alt="{{ item.title }}" />
    {% endif %}
    <div class="card-caption">
      <strong>{{ item.title }}</strong>
      <span>{{ item.category }}</span>
    </div>
    {% include 'scrollr/post_actions.html' with item=item %}
  </div>
</article>
