<header class="topbar">
  <a class="brand" href="{% url 'index' %}" aria-label="Yourstagram home">
    <span class="brand-mark">▶</span>
    <span>Yourstagram</span>
  </a>

  <form id="search-form" class="search-wrap" method="get">
    <span class="search-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <circle cx="10.8" cy="10.8" r="6.3" />
        <path d="m16 16 4.3 4.3" />
      </svg>
    </span>
    <label class="sr-only" for="search">Search media</label>
    <input
      id="search"
      name="q"
      type="search"
      value="{{ query }}"
      placeholder="Search media or categories"
      autocomplete="off"
    />
    <button class="search-button" type="submit">Search</button>

    <label class="category-wrap layout-filter">
      <span class="sr-only">Choose columns</span>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="4" y="4" width="4" height="16" rx="1" />
        <rect x="10" y="4" width="4" height="16" rx="1" />
        <rect x="16" y="4" width="4" height="16" rx="1" />
      </svg>
      <select id="layout-select" aria-label="Choose columns">
        <option value="single">Single column</option>
        <option value="double">Double columns</option>
        <option value="triple">Triple columns</option>
      </select>
    </label>

    <label class="category-wrap category-filter">
      <span class="sr-only">Filter by category</span>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 6.5h7l2 2h9v10H3z" />
      </svg>
      <select aria-label="Filter by category" data-route-filter>
        {% for option in category_options %}
          <option value="{{ option.url }}"{% if option.value == selected_category %} selected{% endif %}>
            {{ option.name }}
          </option>
        {% endfor %}
      </select>
    </label>

    <label class="category-wrap vote-filter">
      <span class="sr-only">Filter by your votes</span>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M7 10v10H4a2 2 0 0 1-2-2v-6a2 2 0 0 1 2-2h3Zm0 0 4-7a3 3 0 0 1 2 3v4h5a2 2 0 0 1 2 2l-1.3 6a2 2 0 0 1-2 2H7" />
      </svg>
      <select aria-label="Filter by your votes" data-route-filter>
        {% for option in vote_options %}
          <option value="{{ option.url }}"{% if option.value == selected_vote %} selected{% endif %}>
            {{ option.name }}
          </option>
        {% endfor %}
      </select>
    </label>

    <label class="category-wrap media-filter">
      <span class="sr-only">Filter by media type</span>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="4" width="18" height="16" rx="2" />
        <circle cx="8.5" cy="9" r="1.5" />
        <path d="m21 15-5-5L5 20" />
      </svg>
      <select name="type" aria-label="Filter by media type">
        <option value="all"{% if type_filter == 'all' %} selected{% endif %}>All types</option>
        {% for option in type_options %}
          <option value="{{ option.value }}"{% if type_filter == option.value %} selected{% endif %}>
            {{ option.name }}
          </option>
        {% endfor %}
      </select>
    </label>
  </form>
  {% if can_choose_library %}
    <button id="open-sync" class="sync-button" type="button" aria-label="Add a media folder">+</button>
    <dialog id="sync-dialog" class="sync-dialog">
      <form method="post" action="{% url 'sync_library' %}">
        {% csrf_token %}
        <h2>Add a media folder</h2>
        <p>Enter the path to the folder containing your category folders and files.</p>
        <label for="library-folder">Folder path</label>
        <input id="library-folder" name="folder" type="text" value="{{ library_path }}" placeholder="/path/to/your/media" required>
        <div class="sync-dialog-actions">
          <button id="close-sync" type="button">Cancel</button>
          <button type="submit">Sync library</button>
        </div>
      </form>
    </dialog>
  {% endif %}
</header>
