<article class="clip-card" data-media-id="{{ media.path }}">
  <div class="video-frame">
    {% if media.type == 'video' %}
      <video data-src="{{ media.url }}" muted playsinline preload="none" loop aria-label="{{ media.title }}"></video>
    {% else %}
      <img src="{{ media.url }}" loading="lazy" decoding="async" alt="{{ media.title }}" />
    {% endif %}
    <span class="media-badge">
      {% if media.media_type == 'video' %}
        VID
      {% elif media.media_type == 'gif' %}
        GIF
      {% else %}
        IMG
      {% endif %}
    </span>
    <div class="video-overlay">
      <div class="overlay-votes">
        <form class="vote-form" method="post" action="{% url 'vote' media.id %}">
          {% csrf_token %}
          <input type="hidden" name="return_to" value="{{ request.get_full_path }}" />
          <input type="hidden" name="choice" value="" /><button class="overlay-button"
            data-vote="like"
            type="submit"
            name="choice"
            value="like"
            aria-label="Like {{ media.title }}"
            aria-pressed="{% if media.vote_choice == 'like' %}
              true
            {% else %}
              false
            {% endif %}">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path fill="{% if media.vote_choice == 'like' %}
                  currentColor
                {% else %}
                  none
                {% endif %}"
                d="M7 10v10H4a2 2 0 0 1-2-2v-6a2 2 0 0 1 2-2h3Zm0 0 4-7a3 3 0 0 1 2 3v4h5a2 2 0 0 1 2 2l-1.3 6a2 2 0 0 1-2 2H7" />
            </svg>
          </button><button class="overlay-button"
            data-vote="dislike"
            type="submit"
            name="choice"
            value="dislike"
            aria-label="Dislike {{ media.title }}"
            aria-pressed="{% if media.vote_choice == 'dislike' %}
              true
            {% else %}
              false
            {% endif %}">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path fill="{% if media.vote_choice == 'dislike' %}
                  currentColor
                {% else %}
                  none
                {% endif %}"
                d="M7 14V4H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h3Zm0 0 4 7a3 3 0 0 0 2-3v-4h5a2 2 0 0 0 2-2l-1.3-6a2 2 0 0 0-2-2H7" />
            </svg>
          </button>
        </form>
      </div>
      {% if media.type == 'video' %}
        <button class="overlay-button audio-button" type="button" data-audio aria-label="Turn audio on" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M11 5 6 9H3v6h3l5 4V5Zm4 4a5 5 0 0 1 0 6m3-9a9 9 0 0 1 0 12" />
          </svg>
        </button>
      {% endif %}
      <button class="overlay-button fullscreen-button" type="button" data-fullscreen aria-label="Fullscreen {{ media.title }}">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5" />
        </svg>
      </button>
      <div class="overlay-caption">
        <strong>{{ media.title }}</strong><span>{{ media.category }}</span>
      </div>
    </div>
  </div>
</article>
